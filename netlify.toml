"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_TURN_URL,VITE_TURN_USERNAME,VITE_TURN_CREDENTIAL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
