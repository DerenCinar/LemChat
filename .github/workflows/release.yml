name: Build & Release SkellyTalk

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute release version from run number
        id: pkg
        run: |
          # Run 101 -> 2.0.1; minor and patch are single digits, major is unbounded.
          V=$(( ${{ github.run_number }} + 100 ))
          NEW_VER="$(( V / 100 )).$(( (V / 10) % 10 )).$(( V % 10 ))"
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

  release-windows:
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Set build version
        run: npm version "${{ needs.prepare-version.outputs.version }}" --no-git-tag-version

      - name: Build Windows Installer & Portable EXE
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $electronVer = node -p "require('electron/package.json').version"
          $cacheDir = Join-Path $env:LOCALAPPDATA "electron\Cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $shasumsPath = Join-Path $cacheDir "SHASUMS256.txt-$electronVer"
          curl.exe -fsSL --retry 5 --retry-delay 3 "https://github.com/electron/electron/releases/download/v$electronVer/SHASUMS256.txt" -o $shasumsPath
          if ($LASTEXITCODE -ne 0) { Remove-Item -Force -ErrorAction SilentlyContinue $shasumsPath }
          $built = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) {
              $built = $true
              break
            }
            Write-Warning "electron-builder attempt $attempt failed (exit $LASTEXITCODE)"
            if ($attempt -lt 3) {
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue release
              Start-Sleep -Seconds ($attempt * 10)
            }
          }
          if (-not $built) { exit 1 }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  release-mac:
    needs: prepare-version
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Set build version
        run: npm version "${{ needs.prepare-version.outputs.version }}" --no-git-tag-version

      - name: Build macOS DMG & ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --dns-result-order=ipv4first
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          ELECTRON_VER=$(node -p "require('electron/package.json').version")
          mkdir -p "$HOME/Library/Caches/electron"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/electron/electron/releases/download/v${ELECTRON_VER}/SHASUMS256.txt" \
            -o "$HOME/Library/Caches/electron/SHASUMS256.txt-${ELECTRON_VER}" \
            || rm -f "$HOME/Library/Caches/electron/SHASUMS256.txt-${ELECTRON_VER}"
          built=0
          for attempt in 1 2 3; do
            if npx electron-builder --mac dmg zip --arm64 --x64 --publish never; then
              built=1
              break
            fi
            echo "electron-builder attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              rm -rf release
              sleep $((attempt * 10))
            fi
          done
          if [ "$built" -ne 1 ]; then
            exit 1
          fi
          for app in release/mac*/SkellyTalk.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release-linux-chromeos-android:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Set build version
        run: npm version "${{ needs.prepare-version.outputs.version }}" --no-git-tag-version

      - name: Build Electron & Vite bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Build Linux AppImage, DEB & ChromeOS Edition
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          ELECTRON_VER=$(node -p "require('electron/package.json').version")
          mkdir -p "$HOME/.cache/electron"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/electron/electron/releases/download/v${ELECTRON_VER}/SHASUMS256.txt" \
            -o "$HOME/.cache/electron/SHASUMS256.txt-${ELECTRON_VER}" \
            || rm -f "$HOME/.cache/electron/SHASUMS256.txt-${ELECTRON_VER}"
          built=0
          for attempt in 1 2 3; do
            if npx electron-builder --linux AppImage deb --publish never; then
              built=1
              break
            fi
            echo "electron-builder attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              rm -rf release
              sleep $((attempt * 10))
            fi
          done
          if [ "$built" -ne 1 ]; then
            exit 1
          fi
          VER="${{ needs.prepare-version.outputs.version }}"
          cp release/*.deb "release/SkellyTalk-ChromeOS-${VER}-amd64.deb"
          (cd dist && zip -r "../release/SkellyTalk-ChromeOS-Web-${VER}.zip" .)
          cp dist/index.html "release/SkellyTalk-ChromeOS-Web-${VER}.html"

      - name: Build Android APK via Capacitor
        run: |
          VER="${{ needs.prepare-version.outputs.version }}"
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          mkdir -p android/app/src/main/java/com/skellytalk/app
          cp android-native/AndroidUpdaterPlugin.java android-native/MainActivity.java android/app/src/main/java/com/skellytalk/app/
          RUN_NUM="${{ github.run_number }}" VER="${VER}" node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.REQUEST_INSTALL_PACKAGES"
            ];
            for (const perm of perms) {
              if (!xml.includes(perm)) {
                xml = xml.replace("<application", `<uses-permission android:name="${perm}" />\n    <application`);
              }
            }
            fs.writeFileSync(p, xml, "utf8");

            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const runNum = Number.parseInt(process.env.RUN_NUM || "1", 10) || 1;
            const verName = process.env.VER || "1.0.0";
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${runNum}`);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${verName}"`);
            fs.writeFileSync(gradlePath, gradle, "utf8");

            const path = require("path");
            const resDir = "android/app/src/main/res";
            const legacyIcon = "public/assets/icon-512.png";
            const fgIcon = "public/assets/android-icon-foreground.png";
            if (fs.existsSync(resDir)) {
              for (const entry of fs.readdirSync(resDir, { withFileTypes: true })) {
                if (!entry.isDirectory()) continue;
                const dirPath = path.join(resDir, entry.name);
                if (entry.name.startsWith("mipmap-")) {
                  for (const name of ["ic_launcher.png", "ic_launcher_round.png"]) {
                    const dest = path.join(dirPath, name);
                    if (fs.existsSync(dest)) fs.copyFileSync(legacyIcon, dest);
                  }
                  const fgDest = path.join(dirPath, "ic_launcher_foreground.png");
                  if (fs.existsSync(fgDest)) fs.copyFileSync(fgIcon, fgDest);
                } else if (entry.name.startsWith("drawable")) {
                  const xmlFg = path.join(dirPath, "ic_launcher_foreground.xml");
                  if (fs.existsSync(xmlFg)) fs.rmSync(xmlFg);
                }
              }
            }
            const bgXmlPath = path.join(resDir, "values/ic_launcher_background.xml");
            fs.mkdirSync(path.dirname(bgXmlPath), { recursive: true });
            fs.writeFileSync(
              bgXmlPath,
              `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#090F0C</color>\n</resources>\n`,
              "utf8"
            );
          '
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/SkellyTalk-Android-${VER}.apk"

      - name: Upload Linux, ChromeOS & Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-chromeos-android-release
          path: |
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.html
            release/*.apk
            release/latest-linux.yml

  publish-release:
    needs: [prepare-version, release-windows, release-mac, release-linux-chromeos-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-releases
          merge-multiple: true

      - name: Publish Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: SkellyTalk v${{ needs.prepare-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: all-releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
